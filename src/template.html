<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
</head>
<body>
  <h1>Weather App</h1>
  <form action="" class="search-location">
    <label for="search-location-input">Search Location:</label>
    <input type="text" class="search-location" id="search-location-input">
    <button class="search-location">Search Location</button>
  </form>
  <h2 id="location"></h2>
  <p id="description"></p>

  <div id="location">
    <div id="conditions">
      <h3></h3>
      <h4></h4>
      <div class="curr-conds">
        <h4>Weather</h4>
        <p id="weather"></p>
        <h4>Temperature</h4>
        <p id="temperature"></p>
        <h4>Wind Speed</h4>
        <p id="wind-speed"></p>
        <h4>Wind Direction</h4>
        <p id="wind-dir"></p>
        <h4>UV Index</h4>
        <p id="uv-index"></p>
      </div>
    </div>
    <div id="forecast">
      <h3>15 Day Forecast</h3>
      <div id="forecast-area">
        <div id="day" class="list"></div>
        <div id="hour" class="list"></div>
        <div id="forecast-display"></div>
      </div>
    </div>
  </div>
</body>
</html>
