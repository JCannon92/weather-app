<!DOC html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
</head>
<body>
  <h1>Weather App</h1>
  <form action="" class="search-location">
    <label for="search-location-input">Search Location:</label>
    <input type="text" class="search-location" id="search-location-input">
    <button class="search-location">Search Location</button>
  </form>
  <h2 id="location"></h2>
  <p id="description"></p>

  <div id="location">
    <div id="conditions">
      <h3></h3>
      <h4></h4>
      <div id="curr-conds">
        <h4>Weather</h4>
        <p id="weather"></p>
        <h4>Temperature</h4>
        <p id="temperature"></p>
        <h4>Wind Speed</h4>
        <p id="wind-speed"></p>
        <h4>Wind Direction</h4>
        <p id="wind-dir"></p>
        <h4>UV Index</h4>
        <p id="uv-index"></p>
      </div>
    </div>
    <div id="forecast">
      <h3>15 Day Forecast</h3>
      <div id="forecast-area">
        <div id="day-list"></div>
        <div id="forecast-display">
          <h4 id="forecast-day-name"></h4>
          <div id="forecast-day-info">
            <h5>Outlook</h5>
            <p id="conditions"></p>
            <h5>Temperature</h5>
            <p id="temp"></p>
            <h5>Temperature (Max)</h5>
            <p id="tempmax"></p>
            <h5>Temperature (Min)</h5>
            <p id="tempmin"></p>
            <h5>Precipition Chance %</h5>
            <p id="precipprob"></p>
            <h5>Sunrise</h5>
            <p id="sunrise"></p>
            <h5>Sunset</h5>
            <p id="sunset"></p>
            <h5>Max UV Index</h5>
            <p id="uvindex"></p>
            <h5>Wind Speed</h5>
            <p id="windspeed"></p>
            <h5>Wind Direction</h5>
            <p id="winddir"></p>
            <h5>Visibility</h5>
            <p id="visibility"></p>
          </div>
        </div>
        <div class="chart-container">
          <canvas id="forecast-chart"></canvas>
        </div>
        <div id="hour-list"></div>
      </div>
    </div>
  </div>
</body>
</html>
